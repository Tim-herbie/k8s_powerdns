apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-rec-config
data:
  recursor.yml: |
    # PowerDNS Recursor configuration file
    incoming:
      allow_from:
      - 0.0.0.0/0
      port: 53

    logging:
      disable_syslog: true
      loglevel: 6
      quiet: true

    recordcache:
      max_negative_ttl: 1
    
    recursor:
      forward_zones_recurse:
      - zone: example.com
        recurse: true
        forwarders:
        - pdns-auth-udp
      - zone: .
        recurse: true
        forwarders:
        - 8.8.8.8:53
      system_resolver_ttl: 60
    
    webservice:
      address: 0.0.0.0
      allow_from:
      - 0.0.0.0/0
      port: 8082
      webserver: true